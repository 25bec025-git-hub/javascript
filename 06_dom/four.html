<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Chai or code | DOM</title>
</head>
<body style ="background-color: #212121; color: #ffffff;">
    <ul class = "language">
        <li>javascript</li>
    </ul>
    
</body>
<script>
    function addLanguage( langName){ // it traverse the whole tree so it is not considered as efiicient
        const li = document.createElement('li');
        li.innerHTML = `${langName}`
        document.querySelector('.language').appendChild(li);
    }
    addLanguage('Python');
    addLanguage('typescript');

    function addOptiLanguage(langName){ // preffered 
        const li = document.createElement('li');
        li.appendChild(document.createTextNode(langName));
        document.querySelector('.language').appendChild(li);

    }
    addOptiLanguage('golang');


    // Edit 
    const secondLang = document.querySelector('li:nth-child(2)');
    console.log(secondLang);
    
    // secondLang.innerHTML = "mojo"
    const newli = document.createElement('li');
    newli.textContent ="mojo"
    secondLang.replaceWith(newli);

    //edit 
    const firstLang = document.querySelector('li:first-child');
    console.log(firstLang);
    // firstLang.innerHTML = "mojo"
    firstLang.outerHTML = '<li>Typescript</li>'
    
    // remove
    const lastLang = document.querySelector('li:last-child');
    lastLang.remove();



</script>
</html>
